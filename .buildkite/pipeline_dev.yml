# Dev pipeline for tpu-inference-dev.
#
# This branch's dev pipeline validates the gemma-4 E2B/E4B Performance step
# across a 2x2x2 matrix: { v6e, v7x_2 } x { text, vision } x { E2B, E4B }.
# Goal: determine which (TPU, model) combinations can run BENCH_DATASET=mm
# (vision through the encoder) without OOM. If v6e OOMs on vision, the
# model yml will gate vision-perf on v7x only, mirroring gemma-4-31B-it.
#
# HOW TO TRIGGER
# ──────────────
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"gemma-4 mm matrix\"}"

steps:

  # -----------------------------------------------------------------
  # Build steps: one per TPU version. Test steps depend_on these.
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Base Image (tpu6e)"
    key: tpu6e_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu6e"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # -----------------------------------------------------------------
  # E2B Performance benchmark matrix
  # -----------------------------------------------------------------

  - label: "tpu6e gemma-4-E2B-it Performance [text]"
    key: tpu6e_e2b_perf_text
    depends_on: tpu6e_build_docker
    soft_fail: true
    agents:
      queue: tpu_v6e_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      TEST_MODEL: google/gemma-4-E2B-it
      TENSOR_PARALLEL_SIZE: "1"
      BENCH_DATASET: "text"
      INPUT_LEN: "1024"
      OUTPUT_LEN: "128"
      MAX_MODEL_LEN: "4096"
      MAX_NUM_SEQS: "64"
      GPU_MEMORY_UTILIZATION: "0.94"
      MINIMUM_THROUGHPUT_THRESHOLD: "0.0"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=1800 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  - label: "tpu6e gemma-4-E2B-it Performance [vision]"
    key: tpu6e_e2b_perf_vision
    depends_on: tpu6e_build_docker
    soft_fail: true
    agents:
      queue: tpu_v6e_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      TEST_MODEL: google/gemma-4-E2B-it
      TENSOR_PARALLEL_SIZE: "1"
      # BENCH_DATASET unset -> mm (random-mm, 6 images/prompt @ 736x736)
      MAX_MODEL_LEN: "4096"
      MAX_NUM_SEQS: "64"
      GPU_MEMORY_UTILIZATION: "0.94"
      MINIMUM_THROUGHPUT_THRESHOLD: "0.0"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=1800 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  - label: "tpu7x gemma-4-E2B-it Performance [text]"
    key: tpu7x_e2b_perf_text
    depends_on: tpu7x_build_docker
    soft_fail: true
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      TEST_MODEL: google/gemma-4-E2B-it
      TENSOR_PARALLEL_SIZE: "2"
      BENCH_DATASET: "text"
      INPUT_LEN: "1024"
      OUTPUT_LEN: "128"
      MAX_MODEL_LEN: "4096"
      MAX_NUM_SEQS: "64"
      GPU_MEMORY_UTILIZATION: "0.94"
      MINIMUM_THROUGHPUT_THRESHOLD: "0.0"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=1800 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  - label: "tpu7x gemma-4-E2B-it Performance [vision]"
    key: tpu7x_e2b_perf_vision
    depends_on: tpu7x_build_docker
    soft_fail: true
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      TEST_MODEL: google/gemma-4-E2B-it
      TENSOR_PARALLEL_SIZE: "2"
      MAX_MODEL_LEN: "4096"
      MAX_NUM_SEQS: "64"
      GPU_MEMORY_UTILIZATION: "0.94"
      MINIMUM_THROUGHPUT_THRESHOLD: "0.0"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=1800 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  # -----------------------------------------------------------------
  # E4B Performance benchmark matrix
  # -----------------------------------------------------------------

  - label: "tpu6e gemma-4-E4B-it Performance [text]"
    key: tpu6e_e4b_perf_text
    depends_on: tpu6e_build_docker
    soft_fail: true
    agents:
      queue: tpu_v6e_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      TEST_MODEL: google/gemma-4-E4B-it
      TENSOR_PARALLEL_SIZE: "1"
      BENCH_DATASET: "text"
      INPUT_LEN: "1024"
      OUTPUT_LEN: "128"
      MAX_MODEL_LEN: "4096"
      MAX_NUM_SEQS: "64"
      GPU_MEMORY_UTILIZATION: "0.85"
      MINIMUM_THROUGHPUT_THRESHOLD: "0.0"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=1800 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  - label: "tpu6e gemma-4-E4B-it Performance [vision]"
    key: tpu6e_e4b_perf_vision
    depends_on: tpu6e_build_docker
    soft_fail: true
    agents:
      queue: tpu_v6e_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      TEST_MODEL: google/gemma-4-E4B-it
      TENSOR_PARALLEL_SIZE: "1"
      MAX_MODEL_LEN: "4096"
      MAX_NUM_SEQS: "64"
      GPU_MEMORY_UTILIZATION: "0.85"
